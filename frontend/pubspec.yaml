name: vokas_app
description: VoKas, catat usaha cukup lewat suara.
publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.0.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  record: ^6.1.1
  path_provider: ^2.1.4
  cross_file: ^0.3.4
  crypto: ^3.0.3
  audioplayers: ^6.1.0
  qr_flutter: ^4.1.0
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1
  timezone: ">=0.9.0 <0.11.0"
  geolocator: ^13.0.2
  share_plus: ^10.1.4
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/suara/

# Ikon aplikasi. Buat ulang dengan: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/ikon/vokas_ikon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#3F5A2A"
  adaptive_icon_foreground: "assets/ikon/vokas_foreground.png"
  web:
    generate: true
    image_path: "assets/ikon/vokas_ikon.png"
    background_color: "#3F5A2A"
    theme_color: "#3F5A2A"
