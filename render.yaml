# Blueprint Render (pengganti Railway). Render > New > Blueprint > pilih repo ini.
# Nilai rahasia (sync: false) diisi di dashboard Render saat pertama kali dibuat, tidak disimpan di repo.
services:
  - type: web
    name: vokas-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    # deploy ulang hanya bila backend berubah (push frontend tidak me-restart server)
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: VOKAS_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:*,https://*.web.app,https://*.firebaseapp.com
      - key: WA_VERIFY_TOKEN
        sync: false
      - key: WA_ACCESS_TOKEN
        sync: false
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: whatsapp:+14155238886
      - key: TWILIO_WEBHOOK_URL
        sync: false
      # email laporan: Brevo HTTP API (Render gratis memblokir port SMTP)
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # login Google: Web client ID dari Google Cloud Console
      - key: GOOGLE_CLIENT_ID
        sync: false
