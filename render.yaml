# Blueprint Render (pengganti Railway). Render > New > Blueprint > pilih repo ini.
# Nilai rahasia (sync: false) diisi di dashboard Render saat pertama kali dibuat, tidak disimpan di repo.
services:
  - type: web
    name: vokas-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: VOKAS_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:*,https://*.web.app,https://*.firebaseapp.com
      - key: WA_VERIFY_TOKEN
        sync: false
      - key: WA_ACCESS_TOKEN
        sync: false
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_APP_SECRET
        sync: false
