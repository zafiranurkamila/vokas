# Build Flutter web dan deploy ke Firebase Hosting setiap ada push ke main yang mengubah frontend.
# Butuh di GitHub (Settings > Secrets and variables > Actions):
#   secret   FIREBASE_SERVICE_ACCOUNT_VOKAS_4E7CC : dibuat otomatis oleh `firebase init hosting:github`
#   secret   VOKAS_API_KEY            : sama dengan VOKAS_API_KEY di Render
#   variable API_URL                  : https://vokas-backend.onrender.com
name: Deploy web ke Firebase

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan folder web (bila belum ada di repo)
        run: |
          if [ ! -d web ]; then
            flutter create . --project-name vokas_app --platforms web
            sed -i 's#<title>[^<]*</title>#<title>VoKas</title>#' web/index.html
            sed -i 's#content="vokas_app"#content="VoKas"#' web/index.html
            sed -i 's#"name": "[^"]*"#"name": "VoKas"#; s#"short_name": "[^"]*"#"short_name": "VoKas"#' web/manifest.json
          fi

      - run: flutter pub get

      - name: Ikon web
        run: dart run flutter_launcher_icons

      - name: Build web
        run: >
          flutter build web --release
          --dart-define=API_URL=${{ vars.API_URL || 'https://vokas-backend.onrender.com' }}
          --dart-define=API_KEY=${{ secrets.VOKAS_API_KEY }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOKAS_4E7CC }}
          projectId: vokas-4e7cc
          channelId: live
          entryPoint: frontend
