# Build APK Android lalu kirim ke tester lewat Firebase App Distribution,
# setiap ada push ke main yang mengubah frontend.
# Butuh di GitHub (Settings > Secrets and variables > Actions):
#   secret   FIREBASE_SERVICE_ACCOUNT_VOKAS_4E7CC : sudah ada (dari firebase init hosting:github);
#            service account-nya perlu ditambah peran "Firebase App Distribution Admin" di Google Cloud IAM
#   secret   VOKAS_API_KEY                        : sudah ada
#   variable API_URL                              : sudah ada
#   variable FIREBASE_ANDROID_APP_ID              : App ID Android, contoh 1:1234567890:android:abc123
#   variable APP_TESTERS                          : email tester dipisah koma
name: APK ke App Distribution

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/apk-distribution.yml"
  workflow_dispatch: {}

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Ikon aplikasi
        run: dart run flutter_launcher_icons

      - name: Kunci penanda tangan APK (tetap)
        env:
          KUNCI: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KUNCI" ]; then
            echo "$KUNCI" | base64 -d > "$RUNNER_TEMP/vokas-rilis.jks"
            echo "VOKAS_KEYSTORE=$RUNNER_TEMP/vokas-rilis.jks" >> "$GITHUB_ENV"
          else
            echo "ANDROID_KEYSTORE_BASE64 belum diisi: APK memakai kunci debug"
          fi

      - name: Build APK
        env:
          VOKAS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=API_URL=${{ vars.API_URL || 'https://vokas-backend.onrender.com' }}
          --dart-define=API_KEY=${{ secrets.VOKAS_API_KEY }}
          --dart-define=GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}

      - name: Simpan service account ke file sementara
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOKAS_4E7CC }}' > "$RUNNER_TEMP/sa.json"

      - name: Kirim ke App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          CATATAN_RILIS: ${{ github.event.head_commit.message || 'Pembaruan VoKas' }}
        run: >
          npx --yes firebase-tools@14 appdistribution:distribute
          build/app/outputs/flutter-apk/app-release.apk
          --app "${{ vars.FIREBASE_ANDROID_APP_ID }}"
          --testers "${{ vars.APP_TESTERS }}"
          --release-notes "$CATATAN_RILIS"
          --project vokas-4e7cc

      - name: Hapus file service account
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
