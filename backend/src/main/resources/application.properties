spring.application.name=vokas-backend
server.port=${PORT:8080}
# pesan error (misal "Nomor belum terdaftar") ikut dikirim ke aplikasi
server.error.include-message=always
# rekaman WAV di browser bisa ~96 KB/detik; 60 detik ~ 6 MB
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
# kolam kecil: Supabase free tier membatasi jumlah koneksi
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

vokas.api-key=${VOKAS_API_KEY:}
vokas.cors-origins=${CORS_ORIGINS:http://localhost:*}
vokas.zona-waktu=Asia/Jakarta

vokas.gemini.api-key=${GEMINI_API_KEY:}
vokas.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
# dicoba berurutan bila model utama penuh, lambat, atau sudah tidak tersedia (pisahkan koma)
vokas.gemini.model-cadangan=${GEMINI_MODEL_CADANGAN:gemini-2.5-flash-lite,gemini-flash-latest,gemini-flash-lite-latest,gemini-2.0-flash,gemini-2.0-flash-lite}

vokas.wa.verify-token=${WA_VERIFY_TOKEN:}
vokas.wa.access-token=${WA_ACCESS_TOKEN:}
vokas.wa.phone-number-id=${WA_PHONE_NUMBER_ID:}
vokas.wa.app-secret=${WA_APP_SECRET:}
vokas.wa.graph-version=v21.0

# Twilio WhatsApp (sandbox), pengganti sementara WhatsApp Cloud API Meta
vokas.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
vokas.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
vokas.twilio.nomor=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
vokas.twilio.webhook-url=${TWILIO_WEBHOOK_URL:}

management.endpoints.web.exposure.include=health
